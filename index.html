<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支持性輔導通報系統</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍀</text></svg>">
  
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>

  <style>
/* ================================
   莫蘭迪色系 Design System
================================ */

:root {
    /* 基礎色 */
    --primary: #7A8A91;
    --primary-dark: #5E6F77;

    --secondary: #B0B7BD;
    --secondary-dark: #8E989F;

    /* 功能色 */
    --success: #A3C9A8;
    --success-dark: #7FA787;

    --warning: #E9C46A;
    --warning-dark: #CFA64A;

    --danger: #E07A7A;
    --danger-dark: #BE6262;

    --info: #A0C4C8;
    --info-dark: #789FA4;

    /* 背景 */
    --bg: #F5F7F6;
    --card: #FFFDF9;

    --preset-bg: #EAF0F1;
    --preset-border: #C7D8DA;

    --time-bg: #F7F1E3;
    --time-border: #E5D7B8;

    /* 文字 */
    --text: #4B5358;
    --text-muted: #7B858A;

    /* 邊框 */
    --border: #E1E5E3;
}


/* ================================
   基本設定
================================ */

body {
    font-family:
        'Segoe UI',
        'Microsoft JhengHei',
        'Noto Sans TC',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    margin: 0;
    padding: 20px;

    background-color: var(--bg);
    color: var(--text);

    transition: background-color 0.3s ease;
}

.container {
    max-width: 980px;
    margin: 0 auto;
}

.card {
    background: var(--card);

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 4px 16px rgba(80, 90, 90, 0.08);

    margin-bottom: 25px;

    border: 1px solid rgba(225, 229, 227, 0.7);
}


/* ================================
   標題
================================ */

h2,
h3 {
    color: var(--primary);

    display: flex;
    align-items: center;
    gap: 10px;

    flex-wrap: wrap;

    margin-top: 0;
}

.hidden {
    display: none !important;
}


/* ================================
   表單
================================ */

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;

    font-weight: bold;
    color: var(--text);
}

input,
select,
textarea {

    width: 100%;

    padding: 9px;

    box-sizing: border-box;

    border: 1px solid var(--border);

    border-radius: 6px;

    background-color: #FFFFFF;

    color: var(--text);

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

input:focus,
select:focus,
textarea:focus {

    outline: none;

    border-color: var(--info-dark);

    box-shadow:
        0 0 0 3px rgba(160, 196, 200, 0.25);
}

textarea {
    resize: vertical;
    height: 60px;
}

input[readonly],
select[disabled] {

    background-color: #EEF0EE;

    cursor: not-allowed;

    color: var(--text-muted);

    border-color: #D9DEDB;
}


/* ================================
   Grid
================================ */

.grid {
    display: flex;
    flex-direction: column;
    gap: 0;
}


/* ================================
   按鈕
================================ */

button {

    background-color: var(--primary);

    color: white;

    border: none;

    padding: 10px 15px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    transition:
        background-color 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
}

button:hover {

    background-color: var(--primary-dark);

    transform: translateY(-1px);

    box-shadow:
        0 3px 8px rgba(94, 111, 119, 0.2);
}

button:disabled {

    background-color: #D6DAD8;

    color: #8A9290;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;
}


/* ================================
   次要按鈕
================================ */

.btn-secondary {

    background-color: var(--secondary);

    font-size: 14px;

    padding: 6px 12px;

    width: auto;
}

.btn-secondary:hover {
    background-color: var(--secondary-dark);
}


/* ================================
   警告按鈕
================================ */

.btn-warning {

    background-color: var(--warning);

    color: #5F512F;

    font-size: 14px;

    padding: 6px 12px;

    width: auto;
}

.btn-warning:hover {
    background-color: var(--warning-dark);
}


/* ================================
   資訊按鈕
================================ */

.btn-info {

    background-color: var(--info-dark);

    color: white;

    font-size: 14px;

    padding: 6px 12px;

    width: auto;
}

.btn-info:hover {
    background-color: #5E858A;
}


/* ================================
   新增按鈕
================================ */

.btn-add {

    background-color: var(--success-dark);

    font-size: 13px;

    padding: 5px 10px;

    width: auto;

    margin-top: 5px;
}

.btn-add:hover {
    background-color: #658D6D;
}


/* ================================
   刪除按鈕
================================ */

.btn-remove {

    background-color: var(--danger);

    color: white;

    font-size: 14px;

    padding: 6px 12px;

    width: auto;
}

.btn-remove:hover {
    background-color: var(--danger-dark);
}


/* ================================
   上方工具列
================================ */

.top-bar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom: 2px solid var(--border);

    padding-bottom: 10px;

    margin-bottom: 20px;
}


/* ================================
   預設區塊
================================ */

.preset-card {

    background-color: var(--preset-bg);

    padding: 15px;

    border-radius: 10px;

    border: 1px solid var(--preset-border);

    margin-bottom: 20px;
}


/* ================================
   時段區塊
================================ */

.time-block-box {

    background: var(--time-bg);

    padding: 15px;

    border-radius: 10px;

    border: 1px solid var(--time-border);

    margin-bottom: 15px;
}

.time-row {

    display: flex;

    gap: 8px;

    align-items: center;

    margin-bottom: 10px;

    flex-wrap: wrap;
}

.time-select {

    padding: 6px;

    border-radius: 6px;

    border: 1px solid var(--border);

    font-size: 15px;

    background-color: #FFFDF9;

    cursor: pointer;

    text-align: center;

    width: 65px;

    font-weight: bold;
}


/* ================================
   表格
================================ */

table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

    min-width: 1000px;

    background-color: var(--card);
}

th,
td {

    border: 1px solid var(--border);

    padding: 10px;

    text-align: left;

    font-size: 14px;

    vertical-align: middle;
}

th {

    background-color: #EEF1EF;

    color: var(--text);

    font-weight: bold;
}

tbody tr {

    transition: background-color 0.2s ease;
}

tbody tr:hover {

    background-color: #F3F6F4;
}


/* ================================
   搜尋區塊
================================ */

.search-box {

    margin-bottom: 15px;

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

.hint {

    font-size: 12px;

    color: var(--text-muted);

    margin-top: 5px;
}


/* ================================
   模式標籤
================================ */

.badge-mode {

    padding: 4px 8px;

    font-size: 16px;

    font-weight: bold;

    color: var(--primary);

    background: transparent;

    border: 2px solid currentColor;

    border-radius: 6px;

    margin-left: 5px;

    cursor: default;
}

.badge-mode.edit {
    color: var(--danger);
}

.badge-mode.edit-rest {
    color: var(--success-dark);
}


/* ================================
   職位標籤
================================ */

.badge-role {

    background: var(--info);

    color: #43575A;

    padding: 4px 8px;

    border-radius: 6px;

    font-size: 12px;

    margin-left: 5px;
}


/* ================================
   時間顯示
================================ */

.duration-display {

    font-weight: bold;

    color: var(--danger-dark);

    margin-top: 5px;

    font-size: 14px;
}

.cumulative-display {

    font-weight: bold;

    color: var(--info-dark);

    margin-top: 5px;

    font-size: 14px;
}

.error-text {

    color: var(--danger-dark);

    font-size: 13px;

    font-weight: bold;

    margin-top: 5px;
}

.text-danger {
    color: var(--danger-dark);
}

.text-info {
    color: var(--info-dark);
}

/* ================================
   提示訊息
================================ */

.group-warning-text {

    color: var(--primary-dark);

    background-color: var(--preset-bg);

    padding: 8px 12px;

    border: 1px solid var(--preset-border);

    border-radius: 6px;

    font-size: 13px;

    font-weight: bold;

    margin-top: 5px;

    line-height: 1.5;
}


/* ================================
   SweetAlert
================================ */

.swal2-title {

    font-size: 1.5rem !important;

    color: var(--primary) !important;
}

.swal2-html-container {

    font-size: 1.1rem !important;

    color: var(--text) !important;
}


/* ================================
   快速連結
================================ */

.quick-links-container {

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 25px;

    padding-top: 15px;

    border-top: 1px dashed #C9CFCC;
}

.capsule-link {

    display: inline-flex;

    align-items: center;

    padding: 8px 16px;

    text-decoration: none;

    border-radius: 50px;

    font-size: 14px;

    font-weight: bold;

    border: 1px solid transparent;

    transition: all 0.2s ease;
}

.capsule-link:hover {

    transform: translateY(-2px);

    box-shadow:
        0 3px 8px rgba(80, 90, 90, 0.1);
}


/* 灰藍 */
.link-blue {

    background-color: #E8EFF0;

    color: #61737A;

    border-color: #C9D9DB;
}

.link-blue:hover {
    background-color: #D9E5E7;
}


/* 鼠尾草綠 */
.link-green {

    background-color: #E7F0E7;

    color: #66856B;

    border-color: #C4D8C6;
}

.link-green:hover {
    background-color: #D7E6D8;
}


/* 柔和橘黃 */
.link-orange {

    background-color: #F8EEDB;

    color: #A67B3D;

    border-color: #E9D3A5;
}

.link-orange:hover {
    background-color: #F1E1BF;
}


/* ================================
   即將到來的排班卡片
================================ */

.upcoming-card {

    border: 1px solid var(--border);

    border-left: 4px solid var(--primary);

    border-radius: 8px;

    padding: 10px;

    margin-bottom: 8px;

    background: #FFFDF9;

    cursor: pointer;

    transition: all 0.2s ease;
}

.upcoming-card:hover {

    background: #EEF3F2;

    transform: translateX(3px);

    border-color: #C9D9DB;
}

  </style>
</head>
<body>

  <div class="container">
    
    <div id="loginSection" class="card">
      <h2 style="display: block; text-align: center; line-height: 1.4; margin-bottom: 20px;">北市康職重<br>支持性輔導通報系統<br>(v1.1.0-beta2)</h2>
      
      <div class="form-group">
        <label>帳號</label>
        <input type="text" id="loginUsername" placeholder="請輸入帳號" onkeydown="if(event.key==='Enter') document.getElementById('loginBtn').click()">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="loginPassword" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') document.getElementById('loginBtn').click()">
      </div>
      <button onclick="login()" id="loginBtn" style="width: 100%; margin-top: 10px;">登入</button>
    
      <div class="quick-links-container">
        <a href="https://pwdsvr.wda.gov.tw/" target="_blank" class="capsule-link link-blue">勞委系統(紀錄)</a>
        <a href="https://www.fd-enableap.taipei/enableap/" target="_blank" class="capsule-link link-green">基金系統(月報)</a>
        <a href="https://vrs2.wda.gov.tw/eVRS" target="_blank" class="capsule-link link-orange">專業人員系統(繼續教育)</a>
      </div>
    </div>

    <div id="mainSection" class="hidden">
      
      <div class="card" id="formCard">
        <div class="top-bar">
          <div>
            歡迎，<strong id="currentUserSpan"></strong> 
            <span class="hint">電話: <span id="currentPhoneSpan"></span></span>
          </div>
          <div>
            <button onclick="showUpcomingSchedules()" class="btn-warning" style="margin-right: 10px; background-color: #ffc107; color:#000;">🔔 近期行程</button>
            <button onclick="openAccountSettings()" class="btn-info" style="margin-right: 10px;">⚙️ 帳號設定</button>
            <button onclick="logout()" class="btn-secondary">登出系統</button>
          </div>
        </div>

        <h2 id="formTitle">
          📝 支持性輔導通報 
          <span id="modeBadge" class="badge-mode">【新增模式】</span>
          <button type="button" id="cancelCoachingBtn" class="btn-remove hidden" onclick="cancelCoaching()">🗑️ 取消當日支持輔導</button>
          <button type="button" id="switchModeBtn" class="btn-warning hidden" onclick="switchToAddMode()">🔄 取消修改，返回新增模式</button>
        </h2>

        <div class="preset-card" id="presetCard">
          <label>⚡ 快速選擇過往訪視對象 (由新到舊)</label>
          <select id="historySelect" onchange="applyHistoryPreset()">
            <option value="">-- 請選擇歷史服務使用者與事業單位 --</option>
          </select>
          <div class="hint">點選後可自動帶入使用者、事業單位等資訊。</div>
        </div>

        <form id="scheduleForm" onsubmit="submitSchedule(event)">
          <div class="grid">
            <div class="form-group">
              <label>📅 預計職場輔導日期 <span id="dateLockHint" class="hint hidden text-danger">(修改模式不可更改)</span></label>
              <input type="date" id="coachingDate" required onchange="checkDateSequence(); updateCumulativeDuration(); triggerCalculateDuration();">
              <div id="dateSequenceWarning" class="error-text hidden">⚠️ 警告：預計輔導日期早於到職日期！</div>
              </div>
              <div class="form-group">
                <label>⏰ 預計職場輔導時段 <span class="hint">(下拉選單模式)</span></label>
                <div id="timeRowsContainer"></div>
                <button type="button" class="btn-add" id="addTimeBtn" onclick="addTimeRow()">➕ 新增時段</button>
                
                <div id="overlapWarning" class="error-text hidden">⚠️ 警告：時段設定有錯誤或重疊，請修正！</div>
                <div id="agentOverlapWarning" class="error-text hidden"></div>
              </div>
            </div>
            
            <hr style="border: 0; border-top: 1px dashed #ccc; margin: 15px 0;">
            <div class="form-group">
              <label>☕ 休息時間 (選填，將自動計算重疊並扣除時數)</label>
              <div id="restRowsContainer"></div>
              <button type="button" id="addRestBtn" class="btn-add" style="background-color:#17a2b8;" onclick="addRestRow()">➕ 新增休息時段</button>
              <div id="restWarning" class="error-text hidden">⚠️ 警告：休息時間設定有錯誤 (結束需晚於開始)，請修正或留空！</div>
            </div>
            
            <div class="duration-display" id="totalDurationText">本次執行時間：0小時00分</div>
            <div class="cumulative-display" id="cumulativeDurationText">累計總執行時間：---</div>
          </div>

          <div class="form-group">
            <label>備註 (可留空)</label>
            <textarea id="remarks" placeholder="如有其他細節請在此說明..."></textarea>
          </div>
          
          <div class="form-group hidden" id="actionLogContainer">
            <label>📝 系統異動紀錄</label>
            <textarea id="actionLog" readonly style="background-color: #e9ecef; font-size: 13px; height: 80px;" placeholder="目前尚無修改紀錄"></textarea>
          </div>

          <div class="grid hidden" id="agentFieldsContainer">
            <div class="form-group">
              <label>就服員姓名 (主管代填檢視用)</label>
              <input type="text" id="agentName" readonly>
            </div>
            <div class="form-group">
              <label>就服員電話 (主管代填檢視用)</label>
              <input type="tel" id="agentPhone" readonly>
            </div>
          </div>

          <button type="submit" id="submitBtn">儲存並送出通報通知</button>
        </form>
      </div> 

      <div class="card">
        <h3>🔍 歷史通報紀錄查詢 <span id="viewPermissionBadge" class="badge-role"></span></h3>
        <div class="hint" style="margin-bottom: 8px;">💡 提示：請點擊左側「操作」欄位內的按鈕進行對應功能。</div>
        
        <div class="search-box">
          <select id="dateFilterSelect" onchange="filterData()" style="width: auto; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; color: var(--primary); background-color: var(--card); flex-shrink: 0;">
            <option value="1m" selected>📅 近 1 個月</option>
            <option value="last_m">📅 上個月</option>
            <option value="3m">📅 最近 3 個月</option>
            <option value="6m">📅 最近半年</option>
            <option value="all">📅 顯示全部</option>
          </select>
          <input type="text" id="searchInput" oninput="filterData()" placeholder="搜尋關鍵字 (姓名、事業單位、備註...)" style="flex: 1; min-width: 200px;">
        </div>

        <div style="overflow-x: auto;">
          <table>
            <thead id="dataTableHead">
            </thead>
            <tbody id="dataTableBody">
              <tr><td colspan="11" style="text-align: center;">載入中...</td></tr>
            </tbody>
          </table>
        </div>
      </div> 

    </div> 
  </div>

  <script>
    // ⚠️ 記得替換成你的最新 GAS Web App URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyJBpokUNZC4sjOb91S3IBxkJXZjucJ0qRuESGoUhyHBXhzFkbQyXZ3y5g_exBMeqW3Kg/exec"; 
    
    let currentUser = null;
    let sessionToken = null;
    let allSchedules = [];
    let isEditMode = false;
    let currentEditRecordId = null; 
    let currentOverlapState = null; 
    let currentFormMode = 'add'; 

    const CORE_FIELDS = ['clientName', 'onboardDate', 'companyName', 'workAddress', 'contactPerson', 'contactPhone'];

    const SysMsg = {
      alert: (text) => Swal.fire({ title: '系統提示', text: text, icon: 'warning', confirmButtonColor: '#0056b3' }),
      success: (title, text) => Swal.fire({ title: title, text: text, icon: 'success', confirmButtonColor: '#28a745' }),
      error: (title, text) => Swal.fire({ title: title, text: text, icon: 'error', confirmButtonColor: '#dc3545' })
    };

    function cleanAndToHalfWidth(str, isRemarks = false) {
      if (!str) return "";
      let result = str.toString();
      if (!isRemarks) {
        result = result.replace(/\s+/g, ""); 
      }
      return result.replace(/[\uFF01-\uFF5E]/g, function(ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
      }).replace(/\u3000/g, " ").trim();
    }

    function sanitizeInput(str) {
      if (!str) return "";
      return str.toString().replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      if (!username || !password) return SysMsg.alert('請輸入帳號與密碼');

      btn.disabled = true;
      btn.innerText = "登入中...";

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username, password }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const res = await response.json();

        if (res.status === 'success') {
          currentUser = res.user;
          sessionToken = res.token;

          const roleText = currentUser.role === 'admin' ? '主管' : '就服員';
          document.getElementById('currentUserSpan').innerText = `${currentUser.name} (${roleText})`;
          document.getElementById('currentPhoneSpan').innerText = currentUser.phone;
          document.getElementById('viewPermissionBadge').innerText = currentUser.role === 'admin' ? '主管權限：檢視所有人' : '檢視個人紀錄';
          
          document.getElementById('agentName').value = currentUser.name;
          document.getElementById('agentPhone').value = currentUser.phone;

          if (currentUser.role === 'admin') {
             document.getElementById('agentFieldsContainer').classList.remove('hidden');
          } else {
             document.getElementById('agentFieldsContainer').classList.add('hidden');
          }

          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('mainSection').classList.remove('hidden');

          initTimeRows();
          loadSchedules(); 
        } else {
          SysMsg.error('登入失敗', res.message);
        }
      } catch (err) {
        SysMsg.error('連線錯誤', err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "登入";
      }
    }

    async function fetchWithAuth(payload) {
      payload.username = currentUser.username;
      payload.token = sessionToken;
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      });
      const res = await response.json();
      if (res.status === 'error' && res.message.includes('身分驗證失敗')) {
        SysMsg.alert(res.message);
        logout(true);
        throw new Error('Unauthorized');

    function getValidIntervalsFromUI() {
      const sHours = document.querySelectorAll('.start-hour');
      const sMins = document.querySelectorAll('.start-minute');
      const eHours = document.querySelectorAll('.end-hour');
      const eMins = document.querySelectorAll('.end-minute');

        const eh = eHours[i].value;

             intervals.push({ start: sMin, end: eMin, str: `${sh}:${sm}-${eh}:${em}` });

    function parseTimeToMinutes(timeStr) {
      if(!timeStr || typeof timeStr !== 'string') return -1;
      const parts = timeStr.split(':');
      if(parts.length !== 2) return -1;
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      if (isNaN(h) || isNaN(m)) return -1;
      return h * 60 + m;
    }

    function processDurations(coachIntervals, restIntervals) {
      if (coachIntervals.length === 0) return { totalMinutes: 0, hasOverlap: false };
      
      let sorted = [...coachIntervals].sort((a, b) => a.start - b.start);
      let mergedCoaching = [];
      let hasOverlap = false;

      let current = { start: sorted[0].start, end: sorted[0].end };
      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i].start < current.end) {
          hasOverlap = true;
          current.end = Math.max(current.end, sorted[i].end);
        } else {
          mergedCoaching.push(current);
          current = { start: sorted[i].start, end: sorted[i].end };
        }
      }
      mergedCoaching.push(current);

      let mergedRest = [];
      if (restIntervals && restIntervals.length > 0) {
        let rSorted = [...restIntervals].sort((a, b) => a.start - b.start);
        let rCurr = { start: rSorted[0].start, end: rSorted[0].end };
        for (let i = 1; i < rSorted.length; i++) {
          if (rSorted[i].start <= rCurr.end) {
            rCurr.end = Math.max(rCurr.end, rSorted[i].end);
          } else {
            mergedRest.push(rCurr);
            rCurr = { start: rSorted[i].start, end: rSorted[i].end };
          }
        }
        mergedRest.push(rCurr);
      }

      let totalMinutes = 0;
      for (let c of mergedCoaching) {
        let cTime = c.end - c.start;
        let overlapTime = 0;
        for (let r of mergedRest) {
          let oStart = Math.max(c.start, r.start);
          let oEnd = Math.min(c.end, r.end);
          if (oStart < oEnd) {
            overlapTime += (oEnd - oStart);
          }
        }
        totalMinutes += (cTime - overlapTime);
      }

      return { totalMinutes, hasOverlap };
    }

    function checkAgentScheduleOverlap(targetDateStr, newIntervals, currentClientName) {
      if (!targetDateStr || newIntervals.length === 0) return null;

      let existingSlots = [];
      for (let item of allSchedules) {
        const coachingTimeStr = String(item.coachingTime || ""); 
        if (isEditMode && item.id === currentEditRecordId) continue;
        if (coachingTimeStr.includes('取消')) continue;
        
        const itemCreator = item.createdBy || item.agentName; 
        const currentCreator = currentUser.username || currentUser.name;
        if (itemCreator !== currentCreator) continue; 
        if (formatDate(item.coachingDate) !== targetDateStr) continue;

        const timeSlots = coachingTimeStr.split('、'); 
        for (let slot of timeSlots) {
           const parts = slot.split('-');
           if (parts.length === 2) {
             existingSlots.push({
               start: parseTimeToMinutes(parts[0]),
               end: parseTimeToMinutes(parts[1]),
               clientName: item.clientName,
               timeStr: slot
             });
           }
        }
      }

      let groupOverlapResult = null;

      for (let newSlot of newIntervals) {
        for (let existSlot of existingSlots) {
          if (newSlot.start < existSlot.end && newSlot.end > existSlot.start) {
            const existClientLower = cleanAndToHalfWidth(existSlot.clientName).toLowerCase();
            const isSamePerson = (existClientLower === currentClientName);
            
            if (isSamePerson) {
              return { clientName: existSlot.clientName, timeStr: existSlot.timeStr, isSamePerson: true }; 
            } else {
              if (!groupOverlapResult) {
                groupOverlapResult = { clientName: existSlot.clientName, timeStr: existSlot.timeStr, isSamePerson: false };
              }
            }
          }
        }
      }
      return groupOverlapResult;
    }

    function triggerCalculateDuration() {
      const btn = document.getElementById('submitBtn');
      const warningEl = document.getElementById('overlapWarning');
      const restWarningEl = document.getElementById('restWarning');
      const agentOverlapWarningEl = document.getElementById('agentOverlapWarning');
      const formDateStr = document.getElementById('coachingDate').value;
      const durationDisplay = document.getElementById('totalDurationText');
      const currentClientName = cleanAndToHalfWidth(document.getElementById('clientName').value).toLowerCase();

      currentOverlapState = null; 

      const { intervals: coachIntervals, hasError: hasCoachError } = getValidIntervalsFromUI();
      const { intervals: restIntervals, hasError: hasRestError } = getValidRestIntervalsFromUI();

      if (hasCoachError) {
        showErrorState("⚠️ 警告：時間格式不完整或結束早於開始，請修正！", warningEl, durationDisplay, btn, agentOverlapWarningEl);
        if(restWarningEl) restWarningEl.classList.add('hidden');
        return "錯誤";
      }

      if (hasRestError) {
        if(restWarningEl) restWarningEl.classList.remove('hidden');
        btn.disabled = true;
        durationDisplay.innerText = `本次執行時間：格式錯誤`;
        updateCumulativeDuration();
        return "錯誤";
      } else {
        if(restWarningEl) restWarningEl.classList.add('hidden');
      }

      const { totalMinutes, hasOverlap: hasSelfOverlap } = processDurations(coachIntervals, restIntervals);
      
      if (hasSelfOverlap) {
        showErrorState("⚠️ 警告：表單內的時段設定有重疊，請修正！", warningEl, durationDisplay, btn, agentOverlapWarningEl);
        return "錯誤";
      }

      if (formDateStr && coachIntervals.length > 0) {
        const overlapResult = checkAgentScheduleOverlap(formatDate(formDateStr), coachIntervals, currentClientName);
        if (overlapResult) {
          if (overlapResult.isSamePerson) {
            const msg = `⚠️ 警告：您在此日期與【${escapeHtml(overlapResult.clientName)}】已有安排輔導 (${escapeHtml(overlapResult.timeStr)})，禁止重複排程！`;
            agentOverlapWarningEl.className = 'error-text';
            showErrorState(msg, agentOverlapWarningEl, durationDisplay, btn, warningEl);
            return "錯誤";
          } else {
            currentOverlapState = overlapResult; 
          }
        }
      }

      if (currentOverlapState) {
        agentOverlapWarningEl.innerHTML = `💡提示：您在此時段已有安排【${escapeHtml(currentOverlapState.clientName)}】。若本次為『群組安置』，可繼續送出通報。`;
        agentOverlapWarningEl.className = 'group-warning-text';
        agentOverlapWarningEl.classList.remove('hidden');
      } else {
        agentOverlapWarningEl.classList.add('hidden');
      }

      warningEl.classList.add('hidden');
      btn.disabled = false;
      
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      const durationText = `${hours}小時${mins.toString().padStart(2, '0')}分`;
      durationDisplay.innerText = `本次執行時間：${durationText}`;
      updateCumulativeDuration(); 
      return durationText;
    }

    function showErrorState(message, showEl, displayEl, btn, hideEl) {
       showEl.innerText = message;
       showEl.classList.remove('hidden');
       if (hideEl) hideEl.classList.add('hidden');
       btn.disabled = true;
       displayEl.innerText = `本次執行時間：格式錯誤`;
       updateCumulativeDuration();
    }

    function getFormattedTimeSlots() {
      const { intervals } = getValidIntervalsFromUI();
      return intervals.map(inv => inv.str).join('、');
    }

    function parseDurationToMinutes(durationStr) {
      const str = String(durationStr || "");
      if (str.includes("錯誤") || str.includes("取消")) return 0;
      let hours = 0, mins = 0;
      const hMatch = str.match(/(\d+)小時/);
      const mMatch = str.match(/(\d+)分/);
      if (hMatch) hours = parseInt(hMatch[1], 10);
      if (mMatch) mins = parseInt(mMatch[1], 10);
      return hours * 60 + mins;
    }

    // ★ 修改：修正原本因為雙重抓取產生的效能耗損，現改用簡易版加總
    function updateCumulativeDuration() {
      const clientName = cleanAndToHalfWidth(document.getElementById('clientName').value).toLowerCase();
      const companyName = cleanAndToHalfWidth(document.getElementById('companyName').value).toLowerCase();
      const onboardDate = formatDate(document.getElementById('onboardDate').value);
      const formCoachingDate = formatDate(document.getElementById('coachingDate').value);
      const displayEl = document.getElementById('cumulativeDurationText');
      
      if (!clientName || !companyName || !onboardDate) {
        displayEl.innerText = "累計總執行時間：---";
        return;
      }

      const currentKey = `${clientName}_${companyName}_${onboardDate}`;
      let historyMinutes = 0;
      
      allSchedules.forEach((item) => {
        if (isEditMode && item.id === currentEditRecordId) return; 
        
        const itemClient = cleanAndToHalfWidth(item.clientName).toLowerCase();
        const itemComp = cleanAndToHalfWidth(item.companyName).toLowerCase();
        const itemOnboard = formatDate(item.onboardDate);
        const itemKey = `${itemClient}_${itemComp}_${itemOnboard}`;
        
        if (itemKey === currentKey) {
          const cDate = formatDate(item.coachingDate);
          const coachingTimeStr = String(item.coachingTime || ""); 
          
          if (!formCoachingDate || cDate <= formCoachingDate) {
             if (coachingTimeStr !== "取消輔導" && !coachingTimeStr.includes("取消")) {
                 historyMinutes += parseDurationToMinutes(item.totalDuration);
             }
          }
        }
      });

      const currentDurationText = String(document.getElementById('totalDurationText').innerText);
      let currentMinutes = 0;
      if (currentDurationText.includes('小時') && !currentDurationText.includes('錯誤')) {
         const durStr = currentDurationText.replace('本次執行時間：', '');
         currentMinutes = parseDurationToMinutes(durStr);
      }

      const totalMins = historyMinutes + currentMinutes;
      const hours = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      displayEl.innerText = `累計總執行時間：${hours}小時${mins.toString().padStart(2, '0')}分`;
    }

    async function submitSchedule(e, forcedSubmitType = null) {
      if (e) e.preventDefault();

      if (!checkDateSequence()) {
        SysMsg.error('日期錯誤', '預計職場輔導日期不可早於到職日期，請修正後再送出！');
        return;
      }
      
      let defaultSubmitType = 'new';
      if (currentFormMode === 'edit') defaultSubmitType = 'edit';
      if (currentFormMode === 'edit-rest') defaultSubmitType = 'edit-rest';

      const submitType = forcedSubmitType || defaultSubmitType;
      
      let totalDuration = "0小時00分";
      let coachingTimeStr = "取消輔導";
      let restTimeStr = "";

      if (submitType !== 'cancel') {
        totalDuration = triggerCalculateDuration();
        if (totalDuration === "錯誤") {
          SysMsg.error('排程錯誤', '時段設定有錯誤或與同一對象行程重疊，請修正後再送出！');
          return;
        }

        if (currentOverlapState && submitType !== 'edit-rest') {
          const confirmRes = await Swal.fire({
            title: '⚠️ 偵測到行程重疊',
            html: `系統發現您在此時段已有安排其他服務對象【<b>${escapeHtml(currentOverlapState.clientName)}</b>】。<br><br>請問這是一次「群組安置」（多人同梯次）嗎？`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#6c757d',
            confirmButtonText: '確定是群組安置，送出！',
            cancelButtonText: '返回修改時間'
          });
          if (!confirmRes.isConfirmed) {
            return; 
          }
        }

        coachingTimeStr = getFormattedTimeSlots();
        restTimeStr = getFormattedRestSlots(); 
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '處理中，請稍候...';

      const payload = {
        action: 'submitSchedule',
        submitType: submitType,
        recordId: currentEditRecordId, 
        clientName: sanitizeInput(cleanAndToHalfWidth(document.getElementById('clientName').value)),
        onboardDate: sanitizeInput(cleanAndToHalfWidth(document.getElementById('onboardDate').value)),
        coachingDate: sanitizeInput(cleanAndToHalfWidth(document.getElementById('coachingDate').value)),
        coachingTime: sanitizeInput(cleanAndToHalfWidth(coachingTimeStr)),
        restTime: sanitizeInput(cleanAndToHalfWidth(restTimeStr)),
        companyName: sanitizeInput(cleanAndToHalfWidth(document.getElementById('companyName').value)),
        workAddress: sanitizeInput(cleanAndToHalfWidth(document.getElementById('workAddress').value)),
        contactPerson: sanitizeInput(cleanAndToHalfWidth(document.getElementById('contactPerson').value)),
        contactPhone: sanitizeInput(cleanAndToHalfWidth(document.getElementById('contactPhone').value)),
        remarks: sanitizeInput(cleanAndToHalfWidth(document.getElementById('remarks').value, true)), 
        totalDuration: totalDuration,
        agentName: currentUser.name,
        agentPhone: currentUser.phone
      };

      try {
        const res = await fetchWithAuth(payload);
        if (res.status === 'success') {
          SysMsg.success('處理完成', res.message);
          
          document.getElementById('scheduleForm').reset();
          document.getElementById('historySelect').value = '';
          document.getElementById('agentName').value = currentUser.name;
          document.getElementById('agentPhone').value = currentUser.phone;
          initTimeRows();
          setFormMode('add');
          updateCumulativeDuration(); 
          
          loadSchedules(); 
        } else {
          SysMsg.error('處理失敗', res.message);
        }
      } catch (err) {
        if (err.message !== 'Unauthorized') SysMsg.error('系統錯誤', err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = (currentFormMode === 'edit-rest') ? '儲存補登 (不寄發信件)' : '儲存並送出通報通知';
      }
    }

    // ★ 修改：限縮連線異常的範圍，並改用 O(N) 字典演算法來大幅提升計算效能
    async function loadSchedules() {
      const tbody = document.getElementById('dataTableBody');
      const isAdmin = currentUser && currentUser.role === 'admin';
      const colCount = isAdmin ? 11 : 9; 
      
      let res;
      try {
        // 這裡「只」攔截與後端 GAS 之間的網路連線異常
        res = await fetchWithAuth({ action: 'getSchedules' });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center; color: red; font-weight: bold;">系統連線異常，無法載入紀錄。<br><small>${err.message}</small></td></tr>`;
        return;
      }

      if (res.status === 'success') {
        try {
          allSchedules = res.data;
          
          // 步驟 1：為了正確加總累計時數，先把資料「由舊到新」排序
          allSchedules.sort((a, b) => {
            const dateA = new Date(a.coachingDate).getTime();
            const dateB = new Date(b.coachingDate).getTime();
            if (dateA !== dateB) return dateA - dateB;
            return a.id - b.id; // 如果同一天，照建立順序(ID)排
          });
          
          // 步驟 2：使用 O(N) 字典演算法，順著跑一次就能精準算出每個人的累計時數 (秒殺卡頓)
          const userTotals = new Map();
          allSchedules.forEach((item) => {
            const itemKey = `${cleanAndToHalfWidth(item.clientName).toLowerCase()}_${cleanAndToHalfWidth(item.companyName).toLowerCase()}_${formatDate(item.onboardDate)}`;
            const coachingTimeStr = String(item.coachingTime || "");
            let currentMins = 0;

            if (coachingTimeStr !== "取消輔導" && !coachingTimeStr.includes("取消")) {
               currentMins = parseDurationToMinutes(item.totalDuration);
            }

            const prevTotal = userTotals.get(itemKey) || 0;
            const newTotal = prevTotal + currentMins;
            userTotals.set(itemKey, newTotal);

            const cumHours = Math.floor(newTotal / 60);
            const cumMins = newTotal % 60;
            item.cumText = newTotal > 0 ? `${cumHours}小時${cumMins.toString().padStart(2, '0')}分` : "0小時00分";
          });
          
          // 步驟 3：算完時數後，把整個表格反轉回「由新到舊」供畫面呈現
          allSchedules.sort((a, b) => {
            const dateA = new Date(a.coachingDate).getTime();
            const dateB = new Date(b.coachingDate).getTime();
            if (dateB !== dateA) return dateB - dateA;
            return b.id - a.id; 
          });

          // 步驟 4：綁定這筆資料最後在陣列中的位置，供修改時使用
          allSchedules.forEach((item, idx) => {
             item.originalIndex = idx;
          });
          
          renderHistoryDropdown();
          filterData(); 

          if (!sessionStorage.getItem('hasShownUpcoming')) {
             showUpcomingSchedules(true);
             sessionStorage.setItem('hasShownUpcoming', 'true');
          }

        } catch (renderErr) {
          // 就算這裡的資料解析有瑕疵，也不會把畫面蓋成「系統連線異常」，方便我們除錯
          console.error("資料處理與渲染發生錯誤:", renderErr);
          SysMsg.error('資料處理異常', '部分資料可能格式不符，請聯絡系統管理員。詳細錯誤：' + renderErr.message);
        }
      } else {
        tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center; color: red; font-weight: bold;">讀取失敗：${res.message}<br><small>(可能未發布新版部署，請確認後端設定)</small></td></tr>`;
      }
    }

    function showUpcomingSchedules(autoShow = false) {
      if (!allSchedules || allSchedules.length === 0) return;

      let prefDays = localStorage.getItem('upcomingDaysPref') || '3';
      prefDays = parseInt(prefDays, 10);

      renderUpcomingPopup(prefDays, autoShow);
    }

    function renderUpcomingPopup(days, autoShow) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const targetDate = new Date(today);
      targetDate.setDate(today.getDate() + days);
      const upcoming = allSchedules.filter(item => {
         const cTimeStr = String(item.coachingTime || "");
         if (cTimeStr === '取消輔導' || cTimeStr.includes('取消')) return false;

         const d = new Date(item.coachingDate);
         d.setHours(0,0,0,0);
         return d >= today && d <= targetDate;
      });

      upcoming.sort((a,b) => new Date(a.coachingDate) - new Date(b.coachingDate));
      let html = `
        <div style="text-align: right; margin-bottom: 10px;">
          <label style="font-size: 13px; color: var(--text-muted); font-weight: bold;">顯示未來 
            <select id="upcomingDaysSelect" onchange="window.updateUpcomingDays(this.value)" style="padding: 2px 5px; font-weight:bold; color:var(--primary);">
              <option value="1" ${days===1?'selected':''}>1</option>
              <option value="2" ${days===2?'selected':''}>2</option>
              <option value="3" ${days===3?'selected':''}>3</option>
            </select> 天內
          </label>
        </div>
        <div id="upcomingListContainer" style="text-align: left; max-height: 320px; overflow-y: auto; padding-right: 5px;">
      `;

      if (upcoming.length === 0) {
         html += `<div style="text-align:center; padding: 30px 10px; color:var(--text-muted); font-weight:bold;">近期無安排輔導行程 🎉</div>`;
      } else {
         upcoming.forEach(item => {
           const d = new Date(item.coachingDate);
           d.setHours(0,0,0,0);
           const diffTime = d - today;
           const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
           
           let badge = '';
           if (diffDays === 0) badge = '<span style="background:var(--danger); color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; margin-right:5px; font-weight:normal;">今天</span>';
           else if (diffDays === 1) badge = '<span style="background:var(--warning); color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; margin-right:5px; font-weight:normal;">明天</span>';
           else if (diffDays === 2) badge = '<span style="background:var(--success-dark); color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; margin-right:5px; font-weight:normal;">後天</span>';
           else badge = `<span style="background:var(--info-dark); color:#fff; padding:2px 6px; border-radius:4px; font-size:12px; margin-right:5px; font-weight:normal;">${diffDays}天後</span>`;

           html += `
             <div class="upcoming-card" onclick="populateFormFromRecord(${item.originalIndex}); Swal.close();" title="點擊直接載入這筆資料至表單">
                <div style="margin-bottom: 4px;">${badge} <strong style="color:var(--primary);">${formatDate(item.coachingDate)}</strong> <span style="font-size:13px; color:var(--text-muted); margin-left:8px;">${escapeHtml(item.coachingTime)}</span></div>
                <div style="font-size: 15px; font-weight: bold; margin-bottom: 4px; display:flex; align-items:center; gap:5px; color:var(--text);">👤 ${escapeHtml(item.clientName)} </div>
                <div style="font-size: 13px; color: var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🏢 ${escapeHtml(item.companyName)}</div>
             </div>
           `;
         });
      }
      
      html += `</div>`;
      if (upcoming.length > 0) {
          html += `<div style="font-size:11px; color:var(--text-muted); text-align:left; margin-top:10px;">💡 提示：點擊行程卡片可直接帶入表單修改</div>`;
      }

      if (autoShow && upcoming.length === 0) return;
      Swal.fire({
        title: '🔔 近期輔導行程提醒',
        html: html,
        showConfirmButton: true,
        confirmButtonText: '我知道了',
        confirmButtonColor: '#7A8A91', // 使用莫蘭迪主色
        width: '450px'
      });
    }

    window.updateUpcomingDays = function(val) {
       localStorage.setItem('upcomingDaysPref', val);
       showUpcomingSchedules(false); 
      uniqueMap.forEach((item, key) => {
        const opt = document.createElement('option');
        opt.value = key;
        const agentInfo = isAdmin ? ` (就服員: ${item.agentName})` : '';
        opt.innerText = `👤 ${item.clientName} | 到職:${formatDate(item.onboardDate)} | 🏢 ${item.companyName}${agentInfo}`;
        select.appendChild(opt);
      });
    }
    function applyHistoryPreset() {
      const selectedKey = document.getElementById('historySelect').value;
      if (!selectedKey) return;

      if (selectedKey === 'NEW') {
          CORE_FIELDS.forEach(id => { document.getElementById(id).value = ''; });
          document.getElementById('coachingDate').value = '';
          document.getElementById('remarks').value = '';
          initTimeRows();
          checkDateSequence();
          triggerCalculateDuration();
          
          if (currentFormMode === 'add') {
             unlockCoreFields();
          }
          return;
      }

      const filtered = allSchedules.filter(item => {
        let dateMatch = false;
        if (dateFilter === 'all') {
           dateMatch = true;
        } else {
           const itemDate = new Date(item.coachingDate);
           itemDate.setHours(0,0,0,0);
           if (isNaN(itemDate.getTime())) {
               dateMatch = true; 
           } else {
               dateMatch = (itemDate >= startDate && itemDate <= endDate);
           }
        }

        if (!dateMatch) return false;

        if (!keyword) return true;
        
        const phoneClean = String(item.contactPhone || "").startsWith("'") ? String(item.contactPhone).substring(1) : String(item.contactPhone || "");
        return (
          String(item.clientName || '').toLowerCase().includes(keyword) ||
          String(item.companyName || '').toLowerCase().includes(keyword) ||
          String(item.workAddress || '').toLowerCase().includes(keyword) ||
          String(item.contactPerson || '').toLowerCase().includes(keyword) ||
          phoneClean.toLowerCase().includes(keyword) ||
          String(item.remarks || '').toLowerCase().includes(keyword) ||
          String(item.actionLog || '').toLowerCase().includes(keyword) ||
          String(item.agentName || '').toLowerCase().includes(keyword)
        );
      });
      
      renderTable(filtered);
    }

    function renderTable(data) {
      const thead = document.getElementById('dataTableHead');
      const tbody = document.getElementById('dataTableBody');
      const isAdmin = currentUser && currentUser.role === 'admin';
      const colCount = isAdmin ? 11 : 9;

      thead.innerHTML = `
        <tr>
          <th>操作</th>
          <th>服務使用者</th>
          <th>到職日</th>
          <th>輔導日期/時段</th>
          <th>本次時數</th>
          <th>累計時數</th>
          <th>事業單位/地址</th>
          <th>聯絡人/電話</th>
          <th>備註</th>
          ${isAdmin ? '<th>異動紀錄</th><th>就服員</th>' : ''}
        </tr>
      `;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center;">目前尚無符合的通報紀錄</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map((item) => {
        const phoneClean = String(item.contactPhone || "").startsWith("'") ? String(item.contactPhone).substring(1) : String(item.contactPhone || "");
        const coachingTimeStr = String(item.coachingTime || ""); 
        const restTimeStr = String(item.restTime || "");
        const isCanceled = (coachingTimeStr === '取消輔導' || coachingTimeStr.includes('取消'));
        
        let adminCells = isAdmin ? `
          <td style="color:var(--text-muted); font-size:12px; min-width:180px;">${escapeHtml(item.actionLog || '-').replace(/\n/g, '<br>')}</td>
          <td>${escapeHtml(item.agentName)}</td>
        ` : '';

        let restHtml = "";
        if (restTimeStr && !isCanceled) {
            restHtml = `<br><small style="color:var(--text-muted);">(休: ${escapeHtml(restTimeStr)})</small>`;
        }

        let actionButtonsHtml = "";
        if (!isCanceled) {
          actionButtonsHtml = `
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <button type="button" class="btn-warning" style="font-size:12px; padding:5px 8px; white-space: nowrap; border:none;" onclick="populateFormFromRecord(${item.originalIndex}, false)" title="修改此筆紀錄並重新發送通報">📝 修改重送</button>
              <button type="button" class="btn-info" style="font-size:12px; padding:5px 8px; white-space: nowrap; border:none;" onclick="populateFormFromRecord(${item.originalIndex}, true)" title="僅修改休息時間與備註">☕ 補登休息</button>
              <button type="button" class="btn-secondary" style="font-size:12px; padding:5px 8px; white-space: nowrap; border:none;" onclick="copyRecordText(event, ${item.originalIndex})" title="複製此筆輔導時數資訊">📋 複製時數</button>
            </div>
          `;
        } else {
          actionButtonsHtml = `<span style="color:var(--danger-dark); font-size:12px; font-weight:bold; display:inline-block; margin-top:8px;">🚫 已註銷</span>`;
        }

        return `
        <tr>
          <td style="vertical-align: middle; text-align: center;">
            ${actionButtonsHtml}
          </td>
          <td><strong>${escapeHtml(item.clientName)}</strong></td>
          <td>${formatDate(item.onboardDate)}</td>
          <td>${formatDate(item.coachingDate)}<br><small class="${isCanceled ? 'text-danger' : ''}">${escapeHtml(item.coachingTime)}</small>${restHtml}</td>
          <td><span class="text-danger" style="font-weight:bold;">${escapeHtml(item.totalDuration)}</span></td>
          <td><span class="text-info" style="font-weight:bold;">${item.cumText}</span></td>
          <td>${escapeHtml(item.companyName)}<br><small style="color:var(--text-muted);">${escapeHtml(item.workAddress)}</small></td>
          <td>${escapeHtml(item.contactPerson)}<br><small style="color:var(--text-muted);">${escapeHtml(phoneClean)}</small></td>
          <td><small>${escapeHtml(item.remarks || '-')}</small></td>
          ${adminCells}
        </tr>
      `}).join('');
    }

    function filterData() {
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toISOString().split('T')[0];
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyRecordText(e, originalIndex) {
      e.stopPropagation(); 

      const item = allSchedules[originalIndex];
      if (!item) return;

      const coachingTimeStr = String(item.coachingTime || ""); 
      const restTimeStr = String(item.restTime || ""); 
      if (coachingTimeStr === '取消輔導' || coachingTimeStr.includes('取消')) {
        SysMsg.alert('此筆紀錄已註銷，無法複製輔導資訊！');
        return;
      }

      const formatDuration = (durStr) => {
        let h = 0, m = 0;
        const hMatch = String(durStr).match(/(\d+)小時/);
        const mMatch = String(durStr).match(/(\d+)分/);
        if (hMatch) h = parseInt(hMatch[1], 10);
        if (mMatch) m = parseInt(mMatch[1], 10);
        return `${h}時${m.toString().padStart(2, '0')}分`;
      };

      const currentDurFormatted = formatDuration(item.totalDuration);
      const cumDurFormatted = formatDuration(item.cumText);

      let restPart = "";
      if (restTimeStr) {
          restPart = `，扣除休息時間：${restTimeStr}`;
      }

      const textToCopy = `今日前往職場提供${currentDurFormatted}輔導（時間為：${coachingTimeStr}${restPart}），目前累積支持性輔導時數${cumDurFormatted}。`;

      const textArea = document.createElement("textarea");
      textArea.value = textToCopy;
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: '📝 已成功複製輔導文字！', showConfirmButton: false, timer: 2000 });
        } else {
          SysMsg.error('複製失敗', '無法自動複製，請手動複製。');
        }
      } catch (err) {
        SysMsg.error('複製失敗', '您的瀏覽器不支援自動複製功能。');
      }
      document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
