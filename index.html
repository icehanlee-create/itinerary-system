<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支持性輔導通報系統</title>
  
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>

  <style>
    /* =========================================
       日系高級灰藍風 Design System
    ========================================= */
    :root {
        --primary: #3F5F6F;
        --primary-hover: #304B58;
        --primary-light: #E8EFF2;
        --success: #5F8F72;
        --success-hover: #4B765D;
        --success-light: #EAF2EC;
        --info: #3F7F8C;
        --info-hover: #316875;
        --info-light: #E7F1F3;
        --warning: #C99032;
        --warning-hover: #A87525;
        --warning-light: #FBF3E3;
        --danger: #B95C5C;
        --danger-hover: #9E4747;
        --danger-light: #F8EAEA;
        --secondary: #6F7B84;
        --secondary-hover: #59636A;
        --secondary-light: #EEF1F2;
        --bg: #F6F7F5;
        --card: #FFFFFF;
        --input-bg: #FFFFFF;
        --preset-bg: #EEF4F5;
        --preset-border: #CCDDE1;
        --time-bg: #FBF7EF;
        --time-border: #E8DCC5;
        --text: #2F3437;
        --text-secondary: #536068;
        --text-muted: #667178;
        --border: #DDE2E5;
        --border-light: #E9EDEE;
        --shadow-sm: 0 2px 8px rgba(47, 52, 55, 0.06);
        --shadow-md: 0 5px 18px rgba(47, 52, 55, 0.08);
    }

    body { font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); line-height: 1.5; transition: background-color 0.3s ease; }
    .container { max-width: 980px; margin: 0 auto; }
    .card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--border-light); box-shadow: var(--shadow-md); margin-bottom: 25px; }
    h2, h3 { color: var(--primary); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 0; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-secondary); }
    input, select, textarea { width: 100%; padding: 9px 10px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 7px; background-color: var(--input-bg); color: var(--text); font-family: inherit; transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 3px rgba(63, 127, 140, 0.12); }
    input[readonly], select[disabled] { background-color: #F0F2F1; cursor: not-allowed; color: var(--text-muted); border-color: #E0E4E2; }
    textarea { resize: vertical; height: 60px; }
    .grid { display: flex; flex-direction: column; gap: 0; }
    
    button { background-color: var(--primary); color: #FFFFFF; border: none; padding: 10px 15px; border-radius: 7px; cursor: pointer; font-size: 16px; font-family: inherit; font-weight: bold; transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease; }
    button:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(63, 95, 111, 0.18); }
    button:active { transform: translateY(0); }
    button:disabled { background-color: #C8CFD2; color: #7B858A; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background-color: var(--secondary); font-size: 14px; padding: 6px 12px; width: auto; }
    .btn-secondary:hover { background-color: var(--secondary-hover); }
    .btn-warning { background-color: var(--warning); color: #FFFFFF; font-size: 14px; padding: 6px 12px; width: auto; }
    .btn-warning:hover { background-color: var(--warning-hover); }
    .btn-info { background-color: var(--info); color: #FFFFFF; font-size: 14px; padding: 6px 12px; width: auto; }
    .btn-info:hover { background-color: var(--info-hover); }
    .btn-add { background-color: var(--success); color: #FFFFFF; font-size: 13px; padding: 6px 12px; width: auto; margin-top: 5px; }
    .btn-add:hover { background-color: var(--success-hover); }
    .btn-remove { background-color: var(--danger); color: #FFFFFF; font-size: 14px; padding: 6px 12px; width: auto; }
    .btn-remove:hover { background-color: var(--danger-hover); }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; }
    .preset-card { background-color: var(--preset-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--preset-border); margin-bottom: 20px; }
    .time-block-box { background: var(--time-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--time-border); margin-bottom: 15px; }
    .time-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .time-select { padding: 7px; border-radius: 7px; border: 1px solid var(--border); font-size: 15px; background-color: #FFFFFF; color: var(--text); cursor: pointer; text-align: center; width: 65px; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 1000px; background-color: var(--card); }
    th, td { border: 1px solid var(--border-light); padding: 10px; text-align: left; font-size: 14px; vertical-align: middle; }
    th { background-color: #F0F3F4; color: var(--text-secondary); font-weight: bold; }
    tbody tr { transition: background-color 0.2s ease; }
    tbody tr:nth-child(even) { background-color: #FCFDFC; }
    tbody tr:hover { background-color: #EEF4F5; }
    
    .search-box { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
    .badge-mode { padding: 4px 8px; font-size: 16px; font-weight: bold; color: var(--primary); background: var(--primary-light); border: 1px solid #BFD0D6; border-radius: 6px; margin-left: 5px; cursor: default; }
    .badge-mode.edit { color: var(--danger); background: var(--danger-light); border-color: #E7BABA; }
    .badge-role { background: var(--info-light); color: #356570; border: 1px solid #C7DDE1; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-left: 5px; }
    .duration-display { font-weight: bold; color: var(--danger); margin-top: 5px; font-size: 14px; }
    .cumulative-display { font-weight: bold; color: var(--info); margin-top: 5px; font-size: 14px; }
    .error-text { color: var(--danger); font-size: 13px; font-weight: bold; margin-top: 5px; }
    .group-warning-text { color: var(--primary); background-color: var(--primary-light); padding: 9px 12px; border: 1px solid #C7D9DE; border-radius: 7px; font-size: 13px; font-weight: bold; margin-top: 5px; line-height: 1.5; }
    .swal2-title { font-size: 1.5rem !important; color: var(--primary) !important; }
    .swal2-html-container { font-size: 1.1rem !important; color: var(--text) !important; }
    
    .quick-links-container { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 25px; padding-top: 15px; border-top: 1px dashed #C9D0D3; }
    .capsule-link { display: inline-flex; align-items: center; justify-content: center; padding: 9px 18px; text-decoration: none; border-radius: 50px; font-size: 14px; font-weight: bold; transition: all 0.2s ease; }
    .link-blue { background-color: var(--primary-light); color: var(--primary); border: 1px solid #C6D5DA; }
    .link-blue:hover { background-color: #DCE8EB; transform: translateY(-2px); }
    .link-green { background-color: var(--success-light); color: var(--success); border: 1px solid #C8DCCB; }
    .link-green:hover { background-color: #DCEBDD; transform: translateY(-2px); }
    .link-orange { background-color: var(--warning-light); color: #A87525; border: 1px solid #E6C990; }
    .link-orange:hover { background-color: #F5E5C2; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="container">
    <div id="loginSection" class="card">
      <h2 style="display: block; text-align: center; line-height: 1.4; margin-bottom: 20px;">北市康職重<br>支持性輔導通報系統</h2>
      
      <div class="form-group">
        <label>帳號</label>
        <input type="text" id="loginUsername" placeholder="請輸入帳號" onkeydown="if(event.key==='Enter') document.getElementById('loginBtn').click()">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="loginPassword" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter') document.getElementById('loginBtn').click()">
      </div>
      <button onclick="login()" id="loginBtn" style="width: 100%; margin-top: 10px;">登入</button>
      
      <div class="quick-links-container">
        <a href="https://pwdsvr.wda.gov.tw/" target="_blank" class="capsule-link link-blue">勞委系統(紀錄)</a>
        <a href="https://www.fd-enableap.taipei/enableap/" target="_blank" class="capsule-link link-green">基金系統(月報)</a>
        <a href="https://vrs2.wda.gov.tw/eVRS" target="_blank" class="capsule-link link-orange">專業人員系統(繼續教育)</a>
      </div>
    </div>

    <div id="mainSection" class="hidden">
      <div class="card" id="formCard">
        <div class="top-bar">
          <div>歡迎，<strong id="currentUserSpan"></strong> <span class="hint">電話: <span id="currentPhoneSpan"></span></span></div>
          <div>
            <button onclick="openAccountSettings()" class="btn-info" style="margin-right: 10px;">⚙️ 帳號設定</button>
            <button onclick="logout()" class="btn-secondary">登出系統</button>
          </div>
        </div>

        <h2 id="formTitle">
          📝 支持性輔導通報 
          <span id="modeBadge" class="badge-mode">【新增模式】</span>
          <button type="button" id="cancelCoachingBtn" class="btn-remove hidden" onclick="cancelCoaching()">🗑️ 取消當日支持輔導</button>
          <button type="button" id="switchModeBtn" class="btn-warning hidden" onclick="switchToAddMode()">🔄 取消修改，返回新增模式</button>
        </h2>

        <div class="preset-card" id="presetCard">
          <label>⚡ 快速選擇過往訪視對象 (由新到舊)</label>
          <select id="historySelect" onchange="applyHistoryPreset()">
            <option value="">-- 請選擇歷史服務使用者與事業單位 --</option>
          </select>
          <div class="hint">點選後可自動帶入使用者、事業單位與前次時段設定。</div>
        </div>

        <form id="scheduleForm" onsubmit="submitSchedule(event)">
          <div class="grid">
            <div class="form-group">
              <label>服務使用者姓名 <button type="button" id="unlockCoreBtn" class="btn-warning hidden" onclick="unlockCoreFields()" style="margin-left: 10px; font-size: 12px; padding: 3px 8px;">🔓 解鎖編輯基本資料</button></label>
              <input type="text" id="clientName" required placeholder="例如：王大明" oninput="updateCumulativeDuration()">
            </div>
            <div class="form-group">
              <label>到職日期</label>
              <input type="date" id="onboardDate" required onchange="checkDateSequence(); updateCumulativeDuration();">
            </div>
          </div>

          <div class="time-block-box">
            <div class="grid">
              <div class="form-group">
                <label>📅 預計職場輔導日期 <span id="dateLockHint" class="hint hidden text-danger">(修改模式不可更改)</span></label>
                <input type="date" id="coachingDate" required onchange="checkDateSequence(); updateCumulativeDuration(); calculateTotalDuration();">
                <div id="dateSequenceWarning" class="error-text hidden">⚠️ 警告：預計輔導日期早於到職日期！</div>
              </div>
              <div class="form-group">
                <label>⏰ 預計職場輔導時段</label>
                <div id="timeRowsContainer"></div>
                <button type="button" class="btn-add" id="addTimeBtn" onclick="addTimeRow()">➕ 新增時段</button>
                
                <!-- ★ 補回遺失的休息時段區塊 -->
                <div class="form-group" style="margin-top: 15px; padding: 12px; background-color: var(--preset-bg); border: 1px dashed var(--preset-border); border-radius: 6px;">
                  <label>☕ 休息時段 <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">(系統將自動精準扣除與上方重疊的分鐘數)</span></label>
                  <div id="breakTimeRowsContainer"></div>
                  <button type="button" class="btn-add" style="background-color: var(--info);" onclick="addBreakTimeRow()">➕ 新增休息時段</button>
                </div>

                <div id="overlapWarning" class="error-text hidden">⚠️ 警告：時段設定有錯誤，請修正！</div>
                <div id="agentOverlapWarning" class="error-text hidden">⚠️ 警告：此時段已有其他安排！</div>
                
                <div class="duration-display" id="totalDurationText">本次執行時間：0小時00分</div>
                <div class="cumulative-display" id="cumulativeDurationText">累計總執行時間：---</div>
              </div>
            </div>
          </div>

          <div class="grid">
            <div class="form-group">
              <label>事業單位名稱</label>
              <input type="text" id="companyName" required oninput="onCompanyInput()" placeholder="例如：小杉文化股份有限公司">
            </div>
            <div class="form-group">
              <label>工作地地址</label>
              <input type="text" id="workAddress" required placeholder="例如：台北市信義區市府路1號">
            </div>
          </div>

          <div class="grid">
            <div class="form-group">
              <label>工作地聯絡人</label>
              <input type="text" id="contactPerson" required>
            </div>
            <div class="form-group">
              <label>聯絡人電話</label>
              <input type="tel" id="contactPhone" required>
            </div>
          </div>

          <div class="form-group">
            <label>備註 (可留空)</label>
            <textarea id="remarks" placeholder="如有其他細節請在此說明..."></textarea>
          </div>
          
          <div class="form-group hidden" id="actionLogContainer">
            <label>📝 系統異動紀錄</label>
            <textarea id="actionLog" readonly style="background-color: var(--preset-bg); font-size: 13px; height: 80px;" placeholder="目前尚無修改紀錄"></textarea>
          </div>

          <div class="grid">
            <div class="form-group">
              <label>就服員姓名</label>
              <input type="text" id="agentName" readonly>
            </div>
            <div class="form-group">
              <label>就服員電話</label>
              <input type="tel" id="agentPhone" readonly>
            </div>
          </div>

          <button type="submit" id="submitBtn">儲存並送出通報通知</button>
        </form>
      </div> 

      <div class="card">
        <h3>🔍 歷史通報紀錄查詢 <span id="viewPermissionBadge" class="badge-role"></span></h3>
        <div class="hint" style="margin-bottom: 8px;">💡 提示：點擊下方任意紀錄表格項目，即可將資料帶回上方表單重新修改與寄信！</div>
        <div class="search-box">
          <input type="text" id="searchInput" oninput="filterData()" placeholder="搜尋關鍵字 (姓名、事業單位、備註...)">
        </div>

        <div style="overflow-x: auto;">
          <table>
            <thead id="dataTableHead"></thead>
            <tbody id="dataTableBody">
              <tr><td colspan="10" style="text-align: center;">載入中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div> 
  </div>

  <script>
    // ⚠️ 記得替換成你的最新 GAS Web App URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyJBpokUNZC4sjOb91S3IBxkJXZjucJ0qRuESGoUhyHBXhzFkbQyXZ3y5g_exBMeqW3Kg/exec"; 
    
    let currentUser = null;
    let sessionToken = null;
    let allSchedules = [];
    let isEditMode = false;
    let currentEditRecordId = null; 

    const SysMsg = {
      alert: (text) => Swal.fire({ title: '系統提示', text: text, icon: 'warning', confirmButtonColor: 'var(--primary)' }),
      success: (title, text) => Swal.fire({ title: title, text: text, icon: 'success', confirmButtonColor: 'var(--success)' }),
      error: (title, text) => Swal.fire({ title: title, text: text, icon: 'error', confirmButtonColor: 'var(--danger)' })
    };

    function cleanAndToHalfWidth(str) {
      if (!str) return "";
      let result = str.toString().replace(/\s+/g, "");
      return result.replace(/[\uFF01-\uFF5E]/g, function(ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xfee0); });
    }

    function sanitizeInput(str) { return String(str || "").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    async function login() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      if (!username || !password) return SysMsg.alert('請輸入帳號與密碼');

      btn.disabled = true; btn.innerText = "登入中...";
      try {
        const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username, password }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
        const res = await response.json();
        if (res.status === 'success') {
          currentUser = res.user; sessionToken = res.token;
          const roleText = currentUser.role === 'admin' ? '主管' : '就服員';
          document.getElementById('currentUserSpan').innerText = `${currentUser.name} (${roleText})`;
          document.getElementById('currentPhoneSpan').innerText = currentUser.phone;
          document.getElementById('viewPermissionBadge').innerText = currentUser.role === 'admin' ? '主管權限：檢視所有人' : '檢視個人紀錄';
          document.getElementById('agentName').value = currentUser.name;
          document.getElementById('agentPhone').value = currentUser.phone;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('mainSection').classList.remove('hidden');

          initTimeRows();
          loadSchedules(); 
        } else SysMsg.error('登入失敗', res.message);
      } catch (err) { SysMsg.error('連線錯誤', err.message); } finally { btn.disabled = false; btn.innerText = "登入"; }
    }

    async function fetchWithAuth(payload) {
      payload.username = currentUser.username; payload.token = sessionToken;
      const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
      const res = await response.json();
      if (res.status === 'error' && res.message.includes('身分驗證失敗')) { SysMsg.alert(res.message); logout(true); throw new Error('Unauthorized'); }
      return res;
    }

    async function logout(force = false) {
      if (!force && currentUser && sessionToken) { await fetchWithAuth({ action: 'logout' }).catch(() => {}); }
      currentUser = null; sessionToken = null;
      document.getElementById('mainSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('loginPassword').value = '';
    }

    async function openAccountSettings() {
      const { value: formValues } = await Swal.fire({
        title: '⚙️ 帳號設定',
        html:
          '<div style="text-align:left; font-size:14px; margin-bottom:5px; font-weight:bold; color:var(--primary);">📝 聯絡資訊</div>' +
          '<div style="text-align:left; font-size:13px; margin-bottom:2px;">聯絡電話：</div>' +
          `<input id="swal-input-phone" type="tel" class="swal2-input" style="margin-top:0; margin-bottom:10px; width:100%; box-sizing:border-box; border-radius:7px; border:1px solid var(--border);" value="${currentUser.phone || ''}" placeholder="請輸入聯絡電話">` +
          '<div style="text-align:left; font-size:13px; margin-bottom:2px;">電子郵件 (Email)：</div>' +
          `<input id="swal-input-email" type="email" class="swal2-input" style="margin-top:0; margin-bottom:20px; width:100%; box-sizing:border-box; border-radius:7px; border:1px solid var(--border);" value="${currentUser.email || ''}" placeholder="請輸入電子郵件信箱">` +
          '<hr style="border:0; border-top:1px dashed var(--border); margin:15px 0;">' +
          '<div style="text-align:left; font-size:14px; margin-bottom:5px; font-weight:bold; color:var(--danger);">🔑 變更密碼 <span style="font-size:12px; font-weight:normal; color:var(--text-muted);">(若不修改請留空)</span></div>' +
          '<div style="text-align:left; font-size:13px; margin-bottom:2px;">舊密碼：</div>' +
          '<input id="swal-input-old" type="password" class="swal2-input" style="margin-top:0; margin-bottom:10px; width:100%; box-sizing:border-box; border-radius:7px; border:1px solid var(--border);" placeholder="請輸入目前的密碼">' +
          '<div style="text-align:left; font-size:13px; margin-bottom:2px;">新密碼：</div>' +
          '<input id="swal-input-new" type="password" class="swal2-input" style="margin-top:0; margin-bottom:10px; width:100%; box-sizing:border-box; border-radius:7px; border:1px solid var(--border);" placeholder="請設定新密碼">' +
          '<div style="text-align:left; font-size:13px; margin-bottom:2px;">確認新密碼：</div>' +
          '<input id="swal-input-confirm" type="password" class="swal2-input" style="margin-top:0; width:100%; box-sizing:border-box; border-radius:7px; border:1px solid var(--border);" placeholder="請再次輸入新密碼">',
        focusConfirm: false, showCancelButton: true, confirmButtonColor: 'var(--info)', cancelButtonColor: 'var(--secondary)', confirmButtonText: '儲存設定', cancelButtonText: '取消',
        preConfirm: () => {
          const newPhone = document.getElementById('swal-input-phone').value.trim();
          const newEmail = document.getElementById('swal-input-email').value.trim();
          const oldPwd = document.getElementById('swal-input-old').value;
          const newPwd = document.getElementById('swal-input-new').value;
          const confirmPwd = document.getElementById('swal-input-confirm').value;
          if (!newPhone) { Swal.showValidationMessage('聯絡電話不能為空！'); return false; }
          if (oldPwd || newPwd || confirmPwd) {
            if (!oldPwd || !newPwd || !confirmPwd) { Swal.showValidationMessage('請完整填寫密碼欄位！'); return false; }

    // --- 時間計算與交集處理 ---
    function parseTimeToMinutes(timeStr) {
      if(!timeStr) return 0; const parts = timeStr.split(':');
      if(parts.length !== 2) return 0; return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function calculateTotalDuration() {
      const startInputs = document.querySelectorAll('.start-time'), endInputs = document.querySelectorAll('.end-time');
      let intervals = [], hasTimeError = false, errorMsg = "";

      for (let i = 0; i < startInputs.length; i++) {
        const start = startInputs[i].value, end = endInputs[i].value;
        if (start && end) {
          let sMin = parseTimeToMinutes(start), eMin = parseTimeToMinutes(end);
          if (eMin < sMin) { hasTimeError = true; errorMsg = "結束時間不可早於開始時間，請修正！"; } 
          else if (eMin > sMin) intervals.push({ start: sMin, end: eMin });
        }
      }

      intervals.sort((a, b) => a.start - b.start);
      let totalMinutes = 0, hasOverlap = false;

      if (intervals.length > 0 && !hasTimeError) {
        let current = intervals[0];
        for (let i = 1; i < intervals.length; i++) {
          if (intervals[i].start < current.end) { hasOverlap = true; errorMsg = "輔導時段設定有重疊，請修正！"; current.end = Math.max(current.end, intervals[i].end); } 
          else { totalMinutes += (current.end - current.start); current = intervals[i]; }
        }
        totalMinutes += (current.end - current.start);
      }

      // 處理休息時間扣除
      const breakStartInputs = document.querySelectorAll('.break-start-time'), breakEndInputs = document.querySelectorAll('.break-end-time');
      let breakIntervals = [];
      for (let i = 0; i < breakStartInputs.length; i++) {
        const bStart = breakStartInputs[i].value, bEnd = breakEndInputs[i].value;
        if (bStart && bEnd) {
          const sMin = parseTimeToMinutes(bStart), eMin = parseTimeToMinutes(bEnd);
          if (eMin <= sMin) { hasTimeError = true; errorMsg = "休息時段的結束時間不可早於開始時間！"; } 
          else breakIntervals.push({ start: sMin, end: eMin });
        }
      }

      breakIntervals.sort((a, b) => a.start - b.start);
      let mergedBreaks = [];
      if (breakIntervals.length > 0 && !hasTimeError) {
        let curr = breakIntervals[0];
        for (let i = 1; i < breakIntervals.length; i++) {
          if (breakIntervals[i].start <= curr.end) curr.end = Math.max(curr.end, breakIntervals[i].end); 
          else { mergedBreaks.push(curr); curr = breakIntervals[i]; }
        }
        mergedBreaks.push(curr);
      }

      if (!hasTimeError && intervals.length > 0 && mergedBreaks.length > 0) {
        let totalOverlap = 0;
        for (let c of intervals) {
          for (let b of mergedBreaks) {
            const oStart = Math.max(c.start, b.start), oEnd = Math.min(c.end, b.end);
            if (oStart < oEnd) totalOverlap += (oEnd - oStart);
          }
        }
        totalMinutes -= totalOverlap;
        if (totalMinutes < 0) totalMinutes = 0;
      }

      const btn = document.getElementById('submitBtn'), warningEl = document.getElementById('overlapWarning'), agentOverlapWarningEl = document.getElementById('agentOverlapWarning');
      let hasAgentOverlap = false, overlappingRecordName = "";
      const formDateStr = document.getElementById('coachingDate').value;

      if (formDateStr && intervals.length > 0 && !hasTimeError && !hasOverlap) {
         const targetDateStr = formatDate(formDateStr);
         let otherSchedulesIntervals = [];
         for (let item of allSchedules) {
            if (isEditMode && item.id === currentEditRecordId) continue;
            if (item.coachingTime === '取消輔導' || item.coachingTime.includes('取消')) continue;
            if (item.createdBy !== currentUser.username) continue; 
            if (formatDate(item.coachingDate) !== targetDateStr) continue;

            const timeSlots = String(item.coachingTime).split('、');
            for (let slot of timeSlots) {
               const parts = slot.split('-');
               if (parts.length === 2) otherSchedulesIntervals.push({ start: parseTimeToMinutes(parts[0]), end: parseTimeToMinutes(parts[1]), clientName: item.clientName });
            }
         }

         for (let curr of intervals) {
            for (let other of otherSchedulesIntervals) {
               if (curr.start < other.end && curr.end > other.start) { hasAgentOverlap = true; overlappingRecordName = other.clientName; break; }
            }
            if (hasAgentOverlap) break;
         }
      }

      if (hasAgentOverlap) { agentOverlapWarningEl.innerText = `⚠️ 警告：您在此日期與【${escapeHtml(overlappingRecordName)}】已有安排輔導，禁止重複排程！`; agentOverlapWarningEl.classList.remove('hidden'); } 
      else agentOverlapWarningEl.classList.add('hidden');

      if (hasTimeError || hasOverlap || hasAgentOverlap) {
        if (hasTimeError || hasOverlap) { warningEl.innerText = `⚠️ 警告：${errorMsg}`; warningEl.classList.remove('hidden'); } 
        else warningEl.classList.add('hidden');
        btn.disabled = true; document.getElementById('totalDurationText').innerText = `本次執行時間：格式錯誤`;
        updateCumulativeDuration(); return "錯誤";
      } else {
        warningEl.classList.add('hidden'); btn.disabled = false;
        const hours = Math.floor(totalMinutes / 60), mins = totalMinutes % 60;
        const durationText = `${hours}小時${mins.toString().padStart(2, '0')}分`;
        document.getElementById('totalDurationText').innerText = `本次執行時間：${durationText}`;
        updateCumulativeDuration(); return durationText;
      }
    }

    function getFormattedTimeSlots() {
      const startInputs = document.querySelectorAll('.start-time'), endInputs = document.querySelectorAll('.end-time');
      let slots = [];
      for (let i = 0; i < startInputs.length; i++) { if (startInputs[i].value && endInputs[i].value) slots.push(`${startInputs[i].value}-${endInputs[i].value}`); }
      return slots.join('、');
    }

    function parseDurationToMinutes(durationStr) {
      const str = String(durationStr || ""); if (str.includes("錯誤") || str.includes("取消")) return 0;
      let hours = 0, mins = 0; const hMatch = str.match(/(\d+)小時/), mMatch = str.match(/(\d+)分/);
      if (hMatch) hours = parseInt(hMatch[1], 10); if (mMatch) mins = parseInt(mMatch[1], 10);
      return hours * 60 + mins;
    }

    function updateCumulativeDuration() {
      const clientName = cleanAndToHalfWidth(document.getElementById('clientName').value).toLowerCase(), companyName = cleanAndToHalfWidth(document.getElementById('companyName').value).toLowerCase(), onboardDate = formatDate(document.getElementById('onboardDate').value), formCoachingDate = formatDate(document.getElementById('coachingDate').value), displayEl = document.getElementById('cumulativeDurationText');
      if (!clientName || !companyName || !onboardDate) { displayEl.innerText = "累計總執行時間：---"; return; }

      const dailyLatestMins = new Map();
      allSchedules.forEach((item) => {
        if (isEditMode && item.id === currentEditRecordId) return; 
        const cName = cleanAndToHalfWidth(item.clientName).toLowerCase(), compName = cleanAndToHalfWidth(item.companyName).toLowerCase(), oDate = formatDate(item.onboardDate), cDate = formatDate(item.coachingDate), coachingTimeStr = String(item.coachingTime || "");
        if (cName === clientName && compName === companyName && oDate === onboardDate) {
          if (!formCoachingDate || cDate <= formCoachingDate) {
             if (coachingTimeStr !== "取消輔導" && !coachingTimeStr.includes("取消")) dailyLatestMins.set(cDate, parseDurationToMinutes(item.totalDuration));
          }
        }
      });

      let historyMinutes = 0; dailyLatestMins.forEach(mins => historyMinutes += mins);
      const currentDurationText = String(document.getElementById('totalDurationText').innerText);
      let currentMinutes = 0;
      if (currentDurationText.includes('小時') && !currentDurationText.includes('錯誤')) currentMinutes = parseDurationToMinutes(currentDurationText.replace('本次執行時間：', ''));
      const totalMins = historyMinutes + currentMinutes, hours = Math.floor(totalMins / 60), mins = totalMins % 60;
      displayEl.innerText = `累計總執行時間：${hours}小時${mins.toString().padStart(2, '0')}分`;
    }

    function calculateCumulativeForRecord(recordIndex, allData) {
      const record = allData[recordIndex], rClient = cleanAndToHalfWidth(record.clientName).toLowerCase(), rComp = cleanAndToHalfWidth(record.companyName).toLowerCase(), rOnboard = formatDate(record.onboardDate), targetDateStr = formatDate(record.coachingDate), targetId = record.id; 
      let totalMins = 0;
      for (let i = 0; i < allData.length; i++) {
         const item = allData[i], iClient = cleanAndToHalfWidth(item.clientName).toLowerCase(), iComp = cleanAndToHalfWidth(item.companyName).toLowerCase(), iOnboard = formatDate(item.onboardDate), coachingTimeStr = String(item.coachingTime || "");
         if (iClient === rClient && iOnboard === rOnboard && iComp === rComp) {
            const cDate = formatDate(item.coachingDate);
            if (coachingTimeStr !== "取消輔導" && !coachingTimeStr.includes("取消")) {
               if (cDate < targetDateStr || (cDate === targetDateStr && item.id <= targetId)) totalMins += parseDurationToMinutes(item.totalDuration);
            }
         }
      }
      return totalMins;
    }

    async function loadSchedules() {

        if (res.status === 'success') {
          allSchedules = res.data;
          allSchedules.sort((a, b) => { const dateA = new Date(a.coachingDate).getTime(), dateB = new Date(b.coachingDate).getTime(); if (dateB !== dateA) return dateB - dateA; return b.id - a.id; });
          allSchedules.forEach((item, idx) => {
            const cumulativeMins = calculateCumulativeForRecord(idx, allSchedules), cumHours = Math.floor(cumulativeMins / 60), cumMins = cumulativeMins % 60;
            item.cumText = cumulativeMins > 0 ? `${cumHours}小時${cumMins.toString().padStart(2, '0')}分` : "0小時00分"; item.originalIndex = idx;
          });
          renderHistoryDropdown(); filterData(); 
        } else tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center; color: red; font-weight: bold;">讀取失敗：${res.message}</td></tr>`;
      } catch (err) { tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center; color: red; font-weight: bold;">系統連線異常，無法載入紀錄。<br><small>${err.message}</small></td></tr>`; }
    }

    function renderTable(data) {
      const thead = document.getElementById('dataTableHead'), tbody = document.getElementById('dataTableBody'), isAdmin = currentUser && currentUser.role === 'admin', colCount = isAdmin ? 11 : 9;
      thead.innerHTML = `<tr><th>服務使用者</th><th>到職日</th><th>輔導日期/時段</th><th>本次時數</th><th>累計時數</th><th>複製時數</th><th>事業單位/地址</th><th>聯絡人/電話</th><th>備註</th>${isAdmin ? '<th>異動紀錄</th><th>就服員</th>' : ''}</tr>`;
      if (data.length === 0) return tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align: center;">目前尚無符合的通報紀錄</td></tr>`;

      tbody.innerHTML = data.map((item) => {
        const phoneClean = String(item.contactPhone || "").startsWith("'") ? String(item.contactPhone).substring(1) : String(item.contactPhone || ""), coachingTimeStr = String(item.coachingTime || ""), isCanceled = (coachingTimeStr === '取消輔導' || coachingTimeStr.includes('取消'));
        let adminCells = isAdmin ? `<td style="color:var(--text-muted); font-size:12px; min-width:180px;">${escapeHtml(item.actionLog || '-').replace(/\n/g, '<br>')}</td><td>${escapeHtml(item.agentName)}</td>` : '';
        return `<tr class="clickable-row" onclick="populateFormFromRecord(${item.originalIndex})" title="點擊載入此筆紀錄以修改"><td><strong>${escapeHtml(item.clientName)}</strong></td><td>${formatDate(item.onboardDate)}</td><td>${formatDate(item.coachingDate)}<br><small style="color:${isCanceled?'var(--danger)':'inherit'};">${escapeHtml(item.coachingTime)}</small></td><td><span style="color:var(--danger); font-weight:bold;">${escapeHtml(item.totalDuration)}</span></td><td><span style="color:var(--info); font-weight:bold;">${item.cumText}</span></td><td onclick="event.stopPropagation();"><button type="button" class="btn-secondary" style="font-size:12px; padding:4px 8px; white-space: nowrap;" onclick="copyRecordText(event, ${item.originalIndex})" title="複製此筆輔導時數資訊">複製</button></td><td>${escapeHtml(item.companyName)}<br><small>${escapeHtml(item.workAddress)}</small></td><td>${escapeHtml(item.contactPerson)}<br><small>${escapeHtml(phoneClean)}</small></td><td><small>${escapeHtml(item.remarks || '-')}</small></td>${adminCells}</tr>`;
      }).join('');
    }

    function filterData() {
      const keyword = String(document.getElementById('searchInput').value || "").toLowerCase().trim();
      if (!keyword) return renderTable(allSchedules);
      const filtered = allSchedules.filter(item => {
        const phoneClean = String(item.contactPhone || "").startsWith("'") ? String(item.contactPhone).substring(1) : String(item.contactPhone || "");
        return [item.clientName, item.companyName, item.workAddress, item.contactPerson, phoneClean, item.remarks, item.actionLog, item.agentName].some(val => String(val || '').toLowerCase().includes(keyword));
      });
      renderTable(filtered);
    }

    function formatDate(dateStr) { if (!dateStr) return ''; const d = new Date(dateStr); return isNaN(d.getTime()) ? dateStr : d.toISOString().split('T')[0]; }
    function escapeHtml(str) { return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function copyRecordText(e, originalIndex) {
      e.stopPropagation(); const item = allSchedules[originalIndex]; if (!item) return;
      if (item.coachingTime === '取消輔導' || item.coachingTime.includes('取消')) return SysMsg.alert('此筆紀錄已註銷，無法複製輔導資訊！');
      const formatDuration = (durStr) => { let h = 0, m = 0; const hMatch = String(durStr).match(/(\d+)小時/), mMatch = String(durStr).match(/(\d+)分/); if (hMatch) h = parseInt(hMatch[1], 10); if (mMatch) m = parseInt(mMatch[1], 10); return `${h}小時${m.toString().padStart(2, '0')}分`; };
      const currentDurFormatted = formatDuration(item.totalDuration), cumDurFormatted = formatDuration(item.cumText);
      const textToCopy = `今日前往職場提供${currentDurFormatted}輔導（時間為：${item.coachingTime}），目前累積支持性輔導時數${cumDurFormatted}。`;
      const textArea = document.createElement("textarea"); textArea.value = textToCopy; textArea.style.position = "fixed"; textArea.style.left = "-9999px"; document.body.appendChild(textArea); textArea.focus(); textArea.select();
      try { document.execCommand('copy') ? Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: '📝 已成功複製輔導文字！', showConfirmButton: false, timer: 2000 }) : SysMsg.error('複製失敗', '無法自動複製，請手動複製。'); } catch (err) { SysMsg.error('複製失敗', '您的瀏覽器不支援自動複製功能。'); } document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
